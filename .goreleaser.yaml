# Release build: `git tag v0.1.0 && git push origin v0.1.0` runs
# .github/workflows/release.yml, which runs this. Check locally with
# `goreleaser release --snapshot --clean`.
version: 2

project_name: mtha

builds:
  - main: ./cmd/mtha
    binary: mtha
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # -s -w strips the symbol table and DWARF info; -X stamps `mtha -version`.
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # project.md §6: Linux amd64/arm64, macOS arm64, Windows amd64.
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
